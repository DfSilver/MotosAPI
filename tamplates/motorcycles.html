<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Motocicletas</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Motocicletas registradas</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Modelo</th>
                <th>Marca</th>
            </tr>
        </thead>
        <tbody>
            {% for moto in motorcycles %}
            <tr>
                <td>{{ moto.id }}</td>
                <td>{{ moto.model }}</td>
                <td>{{ moto.brand.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
